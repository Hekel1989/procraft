[package]
name = "procraft-companion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "The ProCraft Diffusion companion: installs, checks and runs a ComfyUI server"

[lints]
workspace = true

[[bin]]
name = "procraft-companion"
path = "src/main.rs"

[dependencies]
procraft-diffusion = { path = "../crates/diffusion" }
clap = { version = "4.6", features = ["derive"] }
ureq = "3.5"
sha2 = "0.11"
flate2 = "1.1"
tar = "0.4"
zip = { version = "9.4", default-features = false, features = ["deflate-flate2"] }
serde = { workspace = true }
serde_json = { workspace = true }
